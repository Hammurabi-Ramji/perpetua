# Perpetua desktop (LtLMA) — quality gates for the launch product
name: Perpetua CI

on:
  push:
    branches: [main, master]
    paths:
      - "LtLMA/**"
      - ".github/workflows/perpetua-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "LtLMA/**"
      - ".github/workflows/perpetua-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: LtLMA

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: LtLMA/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: LtLMA/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests
        working-directory: LtLMA/src-tauri
        run: cargo test

      - name: Frontend unit tests
        run: npm test

      - name: Typecheck
        run: npm run check

      - name: Frontend production build
        run: npm run build
