# Perpetua desktop (desktop/) + companion extension + Polar webhook worker —
# quality gates for the launch product.
name: Perpetua CI

on:
  push:
    branches: [main, master]
    paths:
      - "desktop/**"
      - "polar-webhook/**"
      - ".github/workflows/perpetua-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "desktop/**"
      - "polar-webhook/**"
      - ".github/workflows/perpetua-ci.yml"
  schedule:
    # Weekly: advisories land without any code change.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Frontend unit tests
        run: npm test

      - name: Typecheck
        run: npm run check

      - name: Frontend production build
        run: npm run build

  # Windows is the primary install target (the only platform the release
  # script and signing pipeline cover today). The keyring backend, path
  # handling and `windows_subsystem` attribute only compile here, so a
  # Linux-only test run can go green on code that doesn't build for customers.
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Rust tests (Windows)
        working-directory: desktop/src-tauri
        run: cargo test --locked

  browser-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Extension unit tests
        run: npm test

  polar-webhook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polar-webhook
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # `node --test` on .ts files needs Node's built-in type stripping (>= 22.6).
          node-version: "22"
          cache: npm
          cache-dependency-path: polar-webhook/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Worker unit tests
        run: npm test

  # Dependency advisories. Report-only for now: the 2026-10-07 baseline already
  # has open advisories (see desktop/docs/DEPENDENCY_AUDIT.md), so failing here
  # would turn main red. Flip `continue-on-error` to false once the baseline is
  # clean.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: npm audit (production dependencies)
        run: |
          status=0
          for dir in desktop browser-extension polar-webhook; do
            echo "::group::npm audit $dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high) || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cd desktop/src-tauri && cargo audit
