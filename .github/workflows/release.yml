# Builds Perpetua installers for Windows, macOS, and Linux and attaches them
# to a GitHub Release. Each OS builds natively (Tauri apps aren't cross-
# compilable — Linux needs system WebKitGTK, macOS needs the real SDK) — see
# LtLMA/docs/RELEASE.md for the local (Windows-only) equivalent.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

defaults:
  run:
    working-directory: LtLMA

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: LtLMA/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: LtLMA/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: bake in Polar activation for this build. Unset = offline
          # self-issued keys only (same as a local build with no org id set).
          POLAR_ORGANIZATION_ID: ${{ secrets.POLAR_ORGANIZATION_ID }}
        with:
          projectPath: LtLMA
          tagName: ${{ github.ref_name }}
          releaseName: "Perpetua ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
