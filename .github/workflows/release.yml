# Builds Perpetua installers for Windows, macOS, and Linux and attaches them
# to a GitHub Release. Each OS builds natively (Tauri apps aren't cross-
# compilable — Linux needs system WebKitGTK, macOS needs the real SDK) — see
# LtLMA/docs/RELEASE.md for the local (Windows-only) equivalent.
#
# Two jobs, not one matrixed job: three parallel matrix jobs each trying to
# create/attach to the same GitHub Release race each other (only one
# platform's assets reliably make it in — verified the hard way). `build`
# just compiles and stashes each platform's installers as a workflow
# artifact; the single non-matrixed `publish` job collects all three and
# uploads them together in one release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-latest

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: LtLMA
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: LtLMA/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: LtLMA/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action's own artifact-discovery step has a long history of
      # false-negative "No artifacts were found" failures on Linux/macOS
      # (e.g. tauri-apps/tauri-action#41, #196, #240, #561) even when the
      # build succeeded and the files exist exactly where it looked. Building
      # with the CLI directly — the same command LtLMA/build-release.ps1 uses
      # locally — sidesteps that entirely.
      - name: Build
        run: npm run tauri build
        env:
          # Optional: bake in Polar activation for this build. Unset = offline
          # self-issued keys only (same as a local build with no org id set).
          POLAR_ORGANIZATION_ID: ${{ secrets.POLAR_ORGANIZATION_ID }}
          # Required: signs offline-issued Pro license keys. Release builds
          # fail to compile without this set (see src-tauri/src/services.rs).
          PERPETUA_LICENSE_SECRET: ${{ secrets.PERPETUA_LICENSE_SECRET }}

      - name: Stash installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            LtLMA/src-tauri/target/release/bundle/msi/*.msi
            LtLMA/src-tauri/target/release/bundle/nsis/*.exe
            LtLMA/src-tauri/target/release/bundle/dmg/*.dmg
            LtLMA/src-tauri/target/release/bundle/macos/*.app.tar.gz
            LtLMA/src-tauri/target/release/bundle/deb/*.deb
            LtLMA/src-tauri/target/release/bundle/rpm/*.rpm
            LtLMA/src-tauri/target/release/bundle/appimage/*.AppImage

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: List collected assets
        run: ls -la dist

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: "Perpetua ${{ github.ref_name }}"
          fail_on_unmatched_files: true
          files: dist/**/*
