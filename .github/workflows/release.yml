# Builds Perpetua installers for Windows, macOS, and Linux and attaches them
# to a GitHub Release. Each OS builds natively (Tauri apps aren't cross-
# compilable — Linux needs system WebKitGTK, macOS needs the real SDK) — see
# desktop/docs/RELEASE.md for the local (Windows-only) equivalent.
#
# Two jobs, not one matrixed job: three parallel matrix jobs each trying to
# create/attach to the same GitHub Release race each other (only one
# platform's assets reliably make it in — verified the hard way). `build`
# just compiles and stashes each platform's installers as a workflow
# artifact; the single non-matrixed `publish` job collects all three and
# uploads them together in one release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege by default; only the job that creates the release gets
# write access to repository contents.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-latest

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      # A customer-facing build must be able to activate purchases. Failing
      # here is cheaper than shipping an installer whose "Buy Pro" button
      # leads to a key the app can't redeem (audit finding BLD-10).
      - name: Check release configuration
        shell: bash
        env:
          POLAR_ORGANIZATION_ID: ${{ vars.POLAR_ORGANIZATION_ID || secrets.POLAR_ORGANIZATION_ID }}
          PERPETUA_LICENSE_SECRET: ${{ secrets.PERPETUA_LICENSE_SECRET }}
          VITE_PERPETUA_CHECKOUT_URL: ${{ vars.VITE_PERPETUA_CHECKOUT_URL }}
        run: |
          fail=0
          if [ -z "$POLAR_ORGANIZATION_ID" ]; then
            echo "::error::POLAR_ORGANIZATION_ID (repository variable or secret) is not set — in-app Polar activation would be compiled out."
            fail=1
          fi
          if [ -z "$PERPETUA_LICENSE_SECRET" ]; then
            echo "::error::PERPETUA_LICENSE_SECRET repository secret is not set — release builds cannot sign offline Pro keys."
            fail=1
          fi
          if [ -z "$VITE_PERPETUA_CHECKOUT_URL" ]; then
            echo "::warning::VITE_PERPETUA_CHECKOUT_URL repository variable is not set — the in-app Buy button will fall back to the product page."
          fi
          exit $fail

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action's own artifact-discovery step has a long history of
      # false-negative "No artifacts were found" failures on Linux/macOS
      # (e.g. tauri-apps/tauri-action#41, #196, #240, #561) even when the
      # build succeeded and the files exist exactly where it looked. Building
      # with the CLI directly — the same command desktop/build-release.ps1 uses
      # locally — sidesteps that entirely.
      - name: Build
        run: npm run tauri build
        env:
          # Bakes in Polar activation for this build (checked non-empty above).
          POLAR_ORGANIZATION_ID: ${{ vars.POLAR_ORGANIZATION_ID || secrets.POLAR_ORGANIZATION_ID }}
          # Signs offline-issued Pro license keys. Release builds fail to
          # compile without this set (see src-tauri/src/services.rs).
          PERPETUA_LICENSE_SECRET: ${{ secrets.PERPETUA_LICENSE_SECRET }}
          # Commerce constants shown in the paywall (see desktop/.env.example).
          VITE_PERPETUA_CHECKOUT_URL: ${{ vars.VITE_PERPETUA_CHECKOUT_URL }}
          VITE_PERPETUA_PRO_PRICE: ${{ vars.VITE_PERPETUA_PRO_PRICE }}
          VITE_PERPETUA_PRODUCT_URL: ${{ vars.VITE_PERPETUA_PRODUCT_URL }}
          VITE_PERPETUA_SUPPORT_EMAIL: ${{ vars.VITE_PERPETUA_SUPPORT_EMAIL }}

      # Belt and braces: ask the compiled binary what it thinks. Catches a
      # build-script regression that silently drops the org id.
      - name: Verify Polar activation is compiled in
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            windows-latest) bin="src-tauri/target/release/perpetua.exe" ;;
            *)              bin="src-tauri/target/release/perpetua" ;;
          esac
          output="$("$bin" config)"
          echo "$output"
          echo "$output" | grep -q "Polar activation: ENABLED" || {
            echo "::error::Built binary reports Polar activation DISABLED."
            exit 1
          }

      # ---- BLD-06 (disabled by default): Windows code signing ----------------
      # Enable by setting repo variable SIGN_WINDOWS=true and filling the
      # placeholder variables below. No credentials are stored in this file;
      # azure/trusted-signing-action authenticates via AZURE_* secrets
      # (AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET) that YOU create.
      - name: Sign Windows installers (Trusted Signing)
        if: vars.SIGN_WINDOWS == 'true' && matrix.platform == 'windows-latest'
        uses: azure/trusted-signing-action@v0.5.0 # TODO pin to SHA
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}        # PLACEHOLDER e.g. https://<region>.codesigning.azure.net
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}   # PLACEHOLDER
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}       # PLACEHOLDER
          files-folder: desktop/src-tauri/target/release/bundle
          files-folder-recurse: true
          files-folder-filter: msi,exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # NOTE: signing after `tauri build` signs the bundles but not the inner
      # app exe embedded in them; for full coverage use Tauri's signCommand.

      # ---- BLD-06 (not implemented): macOS signing + notarization ------------
      # Needs Apple Developer ID. Typically done by exposing these env vars to
      # the Build step above (Tauri signs and notarizes automatically):
      #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      # all from repo secrets, guarded by vars.SIGN_MACOS == 'true'.

      - name: Stash installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: List collected assets
        run: ls -la dist

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2 # TODO pin to SHA
        with:
          subject-path: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.app.tar.gz
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage

      - name: Upload release assets
        uses: softprops/action-gh-release@v3 # TODO pin to SHA
        with:
          draft: true
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: "Perpetua ${{ github.ref_name }}"
          fail_on_unmatched_files: true
          files: dist/**/*
