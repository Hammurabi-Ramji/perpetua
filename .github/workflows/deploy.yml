# LicenseVault (LtLM) web edition — CI/CD with paths matching repo layout
name: Deploy LicenseVault

on:
  push:
    branches: [main, master]
    paths:
      - "LtLM/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "LtLM/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            LtLM/backend/package-lock.json
            LtLM/frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: LtLM/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: LtLM/frontend

      - name: Run backend tests
        run: npm test
        working-directory: LtLM/backend

      - name: Build frontend
        run: npm run build
        working-directory: LtLM/frontend

      - name: Run linting
        run: |
          npm run lint || true
        working-directory: LtLM/backend

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./LtLM
          file: ./LtLM/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/licensevault
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker stop licensevault-app || true
            docker rm licensevault-app || true
            docker run -d \
              --name licensevault-app \
              -p 3001:3001 \
              -e NODE_ENV=production \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e SESSION_SECRET=${{ secrets.SESSION_SECRET }} \
              -v /var/www/licensevault/data:/app/backend/data \
              -v /var/www/licensevault/temp:/app/backend/temp \
              -v /var/www/licensevault/logs:/app/backend/logs \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            sleep 30
            curl -f http://localhost:3001/api/health || exit 1

  deploy-webspace:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: LtLM/frontend
        run: |
          npm ci
          npm run build

      - name: Update API URLs
        working-directory: LtLM/frontend/dist
        run: |
          find . -name "*.js" -o -name "*.html" | xargs sed -i 's|http://localhost:3001|${{ secrets.PRODUCTION_API_URL }}|g'

      - name: Deploy to Web Space
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.WEBSPACE_HOST }}
          username: ${{ secrets.WEBSPACE_USER }}
          password: ${{ secrets.WEBSPACE_PASS }}
          local-dir: ./LtLM/frontend/dist/
          server-dir: /

  vscode-extension:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: LtLM/frontend/vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: LtLM/frontend/vscode-extension
        run: npm ci

      - name: Build extension
        working-directory: LtLM/frontend/vscode-extension
        run: npm run compile

      - name: Package extension
        working-directory: LtLM/frontend/vscode-extension
        run: npx vsce package

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: LtLM/frontend/vscode-extension/*.vsix

  browser-extension:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Package browser extension
        working-directory: LtLM/frontend/browser-extension
        run: zip -r ../../../licensevault-extension.zip .

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: licensevault-extension.zip
