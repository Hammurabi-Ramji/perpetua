version: '3.8'

services:
  licensevault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: licensevault-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      # Mount database and uploads as volumes
      - ./data:/app/backend/data
      - ./temp:/app/backend/temp
      - ./logs:/app/backend/logs
    networks:
      - licensevault-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: licensevault-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - licensevault
    networks:
      - licensevault-network

  # Optional: Database backup service
  backup:
    image: alpine:latest
    container_name: licensevault-backup
    restart: "no"
    command: >
      sh -c "
        apk add --no-cache sqlite && \
        while true; do
          sleep 86400 && \
          cp /app/backend/data/app.db /app/backup/app-$(date +%Y%m%d-%H%M%S).db
        done
      "
    volumes:
      - ./data:/app/backend/data:ro
      - ./backup:/app/backup
    networks:
      - licensevault-network

networks:
  licensevault-network:
    driver: bridge

volumes:
  licensevault_data:
  licensevault_logs:
  licensevault_backup: