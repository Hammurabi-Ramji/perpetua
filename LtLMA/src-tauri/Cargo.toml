[package]
name = "perpetua"
version = "1.0.0"
description = "Lifetime License Manager Application"
authors = ["Hammurabi Coding Company, LLC"]
license = "LicenseRef-Proprietary"
repository = ""
edition = "2021"
rust-version = "1.60"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
bcrypt = "0.15"
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
tower-http = { version = "0.6", features = ["cors"] }
csv = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "tokio1", "builder"] }
rand = "0.8"

# Per-OS keyring backend: Windows Credential Manager, macOS Keychain, and
# Linux Secret Service (GNOME Keyring/KWallet) respectively — matching what
# legal/PRIVACY.md tells users their secrets are stored in. A single
# `default-features = false, features = ["windows-native"]` dependency (no
# `[target...]` split) silently ships without a functional keyring backend
# on macOS/Linux, since `release.yml` builds all three platforms.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
aes-gcm = "0.10.3"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]

# Enables the `perpetua mint-key` fulfillment CLI verb in *release* builds.
# Debug builds always have it (dev/test convenience — see main.rs). Never pass
# this to build-release.ps1 / the customer-facing `tauri build`; only use it
# for a separate internal fulfillment binary.
fulfillment = []

[dev-dependencies]
tempfile = "3.17"
tower = { version = "0.5", features = ["util"] }
